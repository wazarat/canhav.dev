# Fly.io deploy for the Ponder indexer. See README.md for the walkthrough.
#
# Rename `app` if you take a different name; everything else is deliberate.

app = "canhav-indexer"
primary_region = "iad"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Never scale to zero. This process is a continuous chain sync, not a
  # request handler; stopping it stops indexing and the app goes quiet.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # /health returns 200 as soon as the server is up. Do NOT point this at
  # /ready, which returns 503 until historical indexing finishes: a full
  # backfill takes hours, so Fly would kill and restart the machine in a loop
  # and the sync would never complete.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

# Steady state. Realtime indexing on this chain is light (~3.5 blocks/sec), so
# 2 shared vCPUs and 1GB is comfortable once the backfill is done.
#
# A cold backfill is a different workload and needs more: on shared-cpu-1x the
# load average sat above 2.0 on one core, which starved the event loop, timed
# out the health check and stalled progress at 3.5% even though the RPC itself
# was answering in ~250ms. Burst for a resync, then come back here:
#
#   fly scale vm shared-cpu-4x --memory 2048 -a canhav-indexer   # backfill
#   fly scale vm shared-cpu-2x --memory 1024 -a canhav-indexer   # after
#
# `fly deploy` resets the machine to what is written here, so this block is the
# value that actually persists.
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024
